<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Summit — Fall loop pass 1</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="facts">PHASE IDLE</div>
  <div id="summit">
    <input id="intention" type="text" maxlength="140" autocomplete="off"
      placeholder="Leave an intention on the stone, or don't." />
    <div id="mood" role="group" aria-label="Mood">
      <button type="button" data-mood="SOLEMN">Solemn</button>
      <button type="button" data-mood="RITUAL" class="on" aria-pressed="true">Ritual</button>
      <button type="button" data-mood="FUCK YES">Fuck yes</button>
    </div>
  </div>
  <div id="verdict" hidden>
    <div id="godtext"></div>
    <button id="jump" type="button">Jump</button>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
